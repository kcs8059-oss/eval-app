<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>평가 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600&display=swap" rel="stylesheet">
<style>
/* VOICE: 평가위원회 운영 장부 — 차분하고 정확하게
   IDEA: 채점표와 집계표. 위원은 종이 채점표처럼, 간사는 집계 대장처럼
   PICTURE: 위원 화면은 채점표 자체, 간사 화면은 위원×대상 현황표와 순위표
   COLOUR and TYPE: 흰 바탕, 먹색, 딥 틸 하나, 경고 적·황 / Noto Serif KR 제목 + Noto Sans KR
   LAYOUT: 상단 제목줄, 탭, 본문 표. 인쇄는 별도 양식 */
:root{color-scheme:light dark;--bg:light-dark(#fff,#0d1416);--ink:light-dark(#14161a,#e6ecec);--mut:light-dark(#5d646b,#9aa7a8);--rule:light-dark(#dfe3e6,#24343a);--panel:light-dark(#f4f7f7,#13201f);--teal:light-dark(#0b5d63,#4fb3b9);--red:light-dark(#b3261e,#ff8a80);--amb:light-dark(#9a6200,#f2c15c);--ok:light-dark(#2e6b3a,#86c995)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(18px,3vw,36px) max(4vw,16px);max-width:1240px;margin:0 auto}
h1{font:600 clamp(24px,3.6vw,34px)/1.15 "Noto Serif KR",serif;margin:0;text-wrap:balance}
h2{font:600 19px/1.3 "Noto Serif KR",serif;margin:22px 0 10px}
h3{font-size:16px;margin:16px 0 8px}
.top{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:end;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:12px}
.sub{color:var(--mut);font-size:14px;margin-top:4px}
nav{display:flex;flex-wrap:wrap;gap:4px;margin-top:12px}
nav button{background:none;color:var(--ink);border:0}
nav button[aria-current]{background:var(--teal);color:var(--bg)}
.note{background:var(--panel);border-inline-start:3px solid var(--amb);padding:10px 14px;font-size:14px;margin:12px 0;border-radius:4px}
.note.t{border-color:var(--teal)}
table{width:100%;border-collapse:collapse;font-size:15px}
th{font-size:13px;color:var(--mut);font-weight:500;text-align:start;padding:7px 6px;border-bottom:1px solid var(--ink);white-space:nowrap}
td{padding:7px 6px;border-bottom:1px solid var(--rule);vertical-align:middle}
.num{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
.c{text-align:center}
.chip{display:inline-block;padding:1px 9px;border-radius:999px;font-size:13px;white-space:nowrap;border:1px solid currentColor}
.c-ok{color:var(--ok)}.c-w{color:var(--amb)}.c-x{color:var(--red)}.c-m{color:var(--mut)}.c-t{color:var(--teal)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:6px;padding:8px 10px;min-height:42px;width:100%}
td input,td select{min-height:38px;padding:6px 8px}
textarea{min-height:90px;font-size:14px}
input[type=checkbox],input[type=radio]{width:20px;height:20px;min-height:0;accent-color:var(--teal);vertical-align:middle}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
button{font:inherit;font-weight:500;min-height:42px;padding:7px 16px;border-radius:6px;border:1px solid var(--teal);background:var(--teal);color:var(--bg);cursor:pointer;white-space:nowrap}
button.g{background:none;color:var(--teal)}button.d{border-color:var(--red);background:none;color:var(--red)}
button.s{min-height:34px;padding:3px 10px;font-size:14px}
button:disabled{opacity:.45;cursor:default}
label{font-size:14px;color:var(--mut);display:block}label>input,label>select,label>textarea{margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 16px}
.chk{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:15px}
.muted{color:var(--mut);font-size:14px}
.scroll{overflow-x:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:14px}
.card{border:1px solid var(--rule);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px}
.card b{font-size:17px}
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:28px}
.hero .card{padding:28px;gap:14px}
.hero .card b{font:600 22px/1.3 "Noto Serif KR",serif}
.judge{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;margin-top:16px}
.tlist button{display:flex;justify-content:space-between;width:100%;text-align:start;background:none;color:var(--ink);border:1px solid var(--rule);margin-bottom:6px;white-space:normal;gap:8px}
.tlist button[aria-current]{border:2px solid var(--teal)}
.sheet{border:1px solid var(--rule);border-radius:10px;padding:18px}
.sheet td.in{width:130px}
.total{font-size:clamp(28px,4vw,40px);font-weight:700;font-variant-numeric:tabular-nums;color:var(--teal)}
.dev{background:light-dark(#fdf1dc,#3a2c0c)}
.drop{text-decoration:line-through;color:var(--mut)}
.sel td{background:light-dark(#eaf4f4,#12302f)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
#print{display:none}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
@media(max-width:760px){.judge{grid-template-columns:1fr}}
@media print{
  body>*:not(#print){display:none!important}
  #print{display:block;color:#000;font-size:11pt}
  #print h1{font-size:18pt;text-align:center;margin:0 0 6pt}
  #print .pg{page-break-after:always}#print .pg:last-child{page-break-after:auto}
  #print table{font-size:10pt}#print th,#print td{border:1px solid #000;padding:4pt 5pt;color:#000}
  #print .meta{display:flex;justify-content:space-between;margin:8pt 0}
  #print .sign{display:flex;justify-content:flex-end;gap:30pt;margin-top:24pt;font-size:11pt}
  @page{size:A4;margin:14mm}
}
</style>
</head>
<body>
<div class="band" id="app"></div>
<div id="print"></div>
<div class="toast" id="toast"></div>
<script>
{
/* ================= 저장소 =================
   API 가 비어 있으면 이 PC 브라우저에 저장(시안·단독 PC 테스트용)
   구글 시트 Apps Script 웹앱 주소를 넣으면 여러 PC가 같은 데이터를 씀 */
const API='https://script.google.com/macros/s/AKfycbwPXG0mGqy1rC4UmuDRU4tznSrKgHANFDZYZaJ2iW547RWA9m5gC3TBIR_2M8zXA4kITQ/exec';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MEM={};
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?(k in MEM?MEM[k]:d):JSON.parse(v)}catch{return k in MEM?MEM[k]:d}},set(k,v){MEM[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch{}},del(k){delete MEM[k];try{localStorage.removeItem(k)}catch{}},keys(){let ks=Object.keys(MEM);try{for(let i=0;i<localStorage.length;i++)ks.push(localStorage.key(i))}catch{}return[...new Set(ks)]}};
let KEY=LS.get('ev.key','');
async function call(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...body,auth:KEY})});const j=await r.json();if(j.error)throw{code:j.error};return j}
const Store={
  async list(p){if(API)return(await call({op:'list',prefix:p})).items||[];return LS.keys().filter(k=>k.startsWith('ev.d.'+p)).map(k=>({key:k.slice(5),val:LS.get(k,null)}))},
  async get(k){if(API)return(await call({op:'get',key:k})).val??null;return LS.get('ev.d.'+k,null)},
  async set(k,v){if(API)return call({op:'set',key:k,val:v});LS.set('ev.d.'+k,v)},
  async del(k){if(API)return call({op:'del',key:k});LS.del('ev.d.'+k)}
};

/* ================= 공통 ================= */
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>new Date(Date.now()+9*36e5).toISOString().slice(0,10);
const r2=(v,d)=>{const m=10**d;return Math.round((v+Number.EPSILON)*m)/m};
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const fmt=(v,d)=>Number(v).toFixed(d);
const ft=v=>Number.isInteger(+v)?String(+v):(+v).toFixed(1);
const toast=t=>{const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('on'),2400)};
const GRADES=[['매우 우수',100],['우수',80],['보통',60],['미흡',40],['매우 미흡',20]];
const OATH='본인은 이 평가의 대상과 친족·고용·거래·자문 등 이해관계가 없으며, 이해관계가 있는 대상은 아래에 표시하여 평가에서 제외하겠습니다. 평가 과정에서 알게 된 정보는 외부에 누설하지 않겠습니다.';
const newEval=()=>({id:'e'+uid(),name:'',type:'서류평가',date:today(),place:'',status:'준비',inputMode:'score',items:[],bonuses:[],targets:[],judges:[],
  rules:{trim:'total',trimMin:5,trimCount:1,failTotal:60,failItemPct:0,tie:[],select:'top',selectN:5,cut:70,round:2,devWarn:20},
  fair:{oath:true,lock:true,text:OATH},created:new Date().toISOString()});
const newCode=ev=>{let c;do c=String(100000+Math.floor(Math.random()*900000));while(ev.judges.some(j=>j.code===c));return c};
const maxTotal=ev=>ev.items.reduce((a,i)=>a+(+i.max||0),0);

/* ================= 점수 계산 ================= */
function compute(ev,scores){
  const R=ev.rules,d=+R.round||2,items=ev.items;
  const rows=ev.targets.map(t=>{
    const per=ev.judges.map(j=>{const s=scores[j.id];if(!s||!s.submitted)return null;if((s.conflicts||[]).includes(t.id))return{j,conflict:true};
      const m=(s.marks||{})[t.id]||{};return{j,m,tot:items.reduce((a,i)=>a+(+m[i.id]||0),0)}}).filter(Boolean);
    const valid=per.filter(p=>!p.conflict),n=valid.length,mean=avg(valid.map(p=>p.tot));
    const can=R.trim!=='none'&&n>=(+R.trimMin||0)&&n>2*(+R.trimCount||1),k=+R.trimCount||1;
    const dropped=new Set(),itemAvg={};let base=0;
    if(can&&R.trim==='total'){const s=[...valid].sort((a,b)=>a.tot-b.tot);s.slice(0,k).forEach(p=>dropped.add(p.j.id+':lo'));s.slice(-k).forEach(p=>dropped.add(p.j.id+':hi'));
      const used=s.slice(k,n-k);items.forEach(i=>itemAvg[i.id]=avg(used.map(p=>+p.m[i.id]||0)));base=avg(used.map(p=>p.tot))}
    else if(can&&R.trim==='item'){items.forEach(i=>{itemAvg[i.id]=avg(valid.map(p=>+p.m[i.id]||0).sort((a,b)=>a-b).slice(k,n-k))});base=items.reduce((a,i)=>a+itemAvg[i.id],0)}
    else{items.forEach(i=>itemAvg[i.id]=avg(valid.map(p=>+p.m[i.id]||0)));base=avg(valid.map(p=>p.tot))}
    base=r2(base,d);
    const bonus=r2((t.bonus||[]).reduce((a,b)=>a+(+(ev.bonuses.find(x=>x.id===b)||{}).pts||0),0),d);
    const final=r2(base+bonus,d);
    let fail='';
    if(!n)fail='미평가';
    else if(+R.failTotal&&base<+R.failTotal)fail='총점 과락';
    else if(+R.failItemPct){const bad=items.filter(i=>itemAvg[i.id]<(+i.max)*R.failItemPct/100);if(bad.length)fail='항목 과락('+bad.map(i=>i.name).join(', ')+')'}
    const dev=new Set(valid.filter(p=>+R.devWarn&&Math.abs(p.tot-mean)>=+R.devWarn).map(p=>p.j.id));
    return{t,per,n,trimmed:can?R.trim:'none',dropped,itemAvg,base,bonus,final,fail,dev,mean};
  });
  const tieItems=(R.tie||[]).filter(id=>items.some(i=>i.id===id));
  const cmp=(a,b)=>{if(b.final!==a.final)return b.final-a.final;for(const id of tieItems){const x=r2(a.itemAvg[id],d),y=r2(b.itemAvg[id],d);if(x!==y)return y-x}return 0};
  const ok=rows.filter(r=>!r.fail).sort(cmp);
  ok.forEach((r,i)=>{r.rank=i&&cmp(ok[i-1],r)===0?ok[i-1].rank:i+1});
  ok.forEach(r=>{r.tie=ok.some(o=>o!==r&&o.rank===r.rank)});
  ok.forEach(r=>{r.selected=R.select==='top'?r.rank<=(+R.selectN||0):r.final>=(+R.cut||0)});
  const cutTie=R.select==='top'&&ok.some(r=>r.rank<=+R.selectN&&ok.filter(o=>o.rank===r.rank).length>1&&r.rank+ok.filter(o=>o.rank===r.rank).length-1>+R.selectN);
  return{rows:[...ok,...rows.filter(r=>r.fail)],cutTie};
}
function ruleText(ev){
  const R=ev.rules,k=R.trimCount||1;
  const t=R.trim==='none'?'위원 전원 점수를 평균':R.trim==='total'?`위원 ${R.trimMin}명 이상이면 총점 기준 최고·최저 각 ${k}명을 빼고 평균`:`위원 ${R.trimMin}명 이상이면 항목마다 최고·최저 각 ${k}개를 빼고 평균`;
  const f=[+R.failTotal?`평균 ${R.failTotal}점 미만 과락`:'',+R.failItemPct?`항목 평균이 배점의 ${R.failItemPct}% 미만이면 과락`:''].filter(Boolean).join(', ');
  const s=R.select==='top'?`과락이 아닌 대상 중 상위 ${R.selectN}개를 선정`:`과락이 아닌 대상 중 ${R.cut}점 이상 전원을 선정`;
  const ti=(R.tie||[]).map(id=>(ev.items.find(i=>i.id===id)||{}).name).filter(Boolean);
  return `${t}하고, 가점을 더해 최종점수를 산출합니다. ${f?f+'입니다. ':''}${s}합니다. 동점이면 ${ti.length?ti.join(' → ')+' 평균이 높은 순, 그래도 같으면 ':''}위원장이 판단합니다.`;
}

/* ================= 상태 ================= */
let S={view:'home',evals:[],ev:null,scores:{},tab:'basic',jid:null,js:null,cur:null,confirm:null,msg:''};
let saveT=null,saveJ=null,poll=null;
const saveEv=()=>{clearTimeout(saveT);const ev=S.ev;saveT=setTimeout(async()=>{try{await Store.set('eval:'+ev.id,ev);flash('저장됨')}catch(e){toast('저장 실패 ('+(e.code||'네트워크')+')')}},500)};
const saveJudge=(now)=>{clearTimeout(saveJ);const ev=S.ev,id=S.jid,s=S.js;const go=async()=>{try{await Store.set('score:'+ev.id+':'+id,s);flash('자동 저장됨')}catch(e){toast('저장 실패 ('+(e.code||'네트워크')+') — 간사에게 알려 주세요')}};if(now)return go();saveJ=setTimeout(go,600)};
const flash=t=>{const e=$('saved');if(e){e.textContent=t;clearTimeout(flash.h);flash.h=setTimeout(()=>{if(e.isConnected)e.textContent=''},1500)}};
async function loadEvals(){S.evals=(await Store.list('eval:')).map(x=>x.val).filter(Boolean).sort((a,b)=>String(b.date).localeCompare(a.date))}
async function loadScores(ev){const l=await Store.list('score:'+ev.id+':');S.scores={};l.forEach(x=>{S.scores[x.key.split(':')[2]]=x.val})}
function go(view,extra){Object.assign(S,{view,confirm:null},extra||{});clearInterval(poll);render();window.scrollTo(0,0)}

/* ================= 화면: 처음 ================= */
function vHome(){return`
<div class="top"><div><h1>평가 관리</h1><div class="sub">서류·발표·제안서 평가 — 위원 채점, 자동 집계, 결과 출력</div></div></div>
${!API?'<div class="note">시안 모드: 데이터가 이 PC 브라우저에만 저장됩니다. 여러 PC에서 함께 쓰려면 구글 시트를 연결해야 합니다.</div>':''}
${API&&!KEY?`<div class="note t"><b>기관 접속 코드</b>를 처음 한 번 입력해 주세요 (간사가 PC마다 설정)<div class="tools"><input id="key" type="password" style="max-width:220px"><button data-a="setkey">확인</button></div><span class="c-x" id="kmsg"></span></div>`:''}
<div class="hero">
  <div class="card"><b>평가위원 입장</b><span class="muted">간사에게 받은 6자리 위원 코드를 입력해 주세요.</span>
    <input id="jcode" inputmode="numeric" maxlength="6" placeholder="위원 코드 6자리" style="font-size:22px;letter-spacing:4px;max-width:260px"><div><button data-a="jlogin">입장</button></div><span class="c-x" id="jmsg"></span></div>
  <div class="card"><b>간사 메뉴</b><span class="muted">평가 만들기, 평가표·계산 규칙 설정, 진행 현황, 결과 출력</span>
    <input id="apin" type="password" placeholder="간사 비밀번호" style="max-width:260px"><div><button class="g" data-a="alogin">간사 입장</button></div><span class="c-x" id="amsg"></span></div>
</div>`}

/* ================= 화면: 간사 목록 ================= */
function vList(){return`
<div class="top"><div><h1>평가 목록</h1><div class="sub">간사 메뉴</div></div><div class="tools"><button data-a="new">새 평가 만들기</button><button class="g" data-a="sample">샘플 평가 만들기</button><button class="g" data-a="home">나가기</button></div></div>
${S.evals.length?`<div class="cards">${S.evals.map(e=>`<div class="card"><span class="chip ${e.status==='평가중'?'c-t':e.status==='마감'?'c-m':'c-w'}" style="align-self:start">${esc(e.status)}</span><b>${esc(e.name||'(이름 없음)')}</b>
<span class="muted">${esc(e.type)} · ${esc(e.date)} · 대상 ${e.targets.length} · 위원 ${e.judges.length} · 만점 ${maxTotal(e)}</span>
<div class="tools"><button class="s" data-a="open" data-id="${esc(e.id)}">열기</button><button class="g s" data-a="copy" data-id="${esc(e.id)}">복제</button><button class="d s" data-a="delev" data-id="${esc(e.id)}">${S.confirm==='del'+e.id?'정말 삭제할까요?':'삭제'}</button></div></div>`).join('')}</div>`
:'<p class="muted" style="margin-top:20px">등록된 평가가 없습니다. ‘새 평가 만들기’로 시작하거나 ‘샘플 평가 만들기’로 둘러보세요.</p>'}
<p class="muted">‘복제’는 평가표·계산 규칙·위원 구성을 그대로 복사하고 점수는 비웁니다. 지난 평가를 복제한 뒤 날짜와 대상만 바꾸면 됩니다.</p>`}

/* ================= 화면: 평가 편집 ================= */
const TABS=[['basic','① 기본정보'],['items','② 평가표'],['rules','③ 계산 규칙'],['targets','④ 평가 대상'],['judges','⑤ 평가위원'],['progress','진행 현황'],['result','결과']];
function vEdit(){const ev=S.ev;return`
<div class="top"><div><h1>${esc(ev.name||'새 평가')}</h1><div class="sub">${esc(ev.type)} · ${esc(ev.date)} · <span class="chip ${ev.status==='평가중'?'c-t':ev.status==='마감'?'c-m':'c-w'}">${esc(ev.status)}</span> <span id="saved" class="muted"></span></div></div>
<div class="tools">${ev.status==='준비'?'<button data-a="start">평가 시작</button>':ev.status==='평가중'?'<button data-a="close">평가 마감</button>':'<button class="g" data-a="reopen">마감 취소</button>'}<button class="g" data-a="list">목록</button></div></div>
<nav>${TABS.map(([k,v])=>`<button data-a="tab" data-t="${k}"${S.tab===k?' aria-current="page"':''}>${v}</button>`).join('')}</nav>
${ev.status!=='준비'&&['items','rules','targets','judges'].includes(S.tab)?'<div class="note">평가가 시작된 뒤 평가표·대상을 바꾸면 이미 입력된 점수와 맞지 않을 수 있습니다. 꼭 필요할 때만 수정하세요.</div>':''}
<section>${({basic:tBasic,items:tItems,rules:tRules,targets:tTargets,judges:tJudges,progress:tProgress,result:tResult})[S.tab]()}</section>`}

function tBasic(){const ev=S.ev;return`
<h2>기본정보</h2><div class="grid">
<label>평가명<input data-b="name" value="${esc(ev.name)}" placeholder="예: 2027 창업도약패키지 서류평가"></label>
<label>평가 유형<select data-b="type">${['서류평가','발표평가','제안서평가','현장평가','기타'].map(t=>`<option${ev.type===t?' selected':''}>${t}</option>`).join('')}</select></label>
<label>평가일<input type="date" data-b="date" value="${esc(ev.date)}"></label>
<label>평가 장소<input data-b="place" value="${esc(ev.place)}" placeholder="예: 본원 3층 회의실"></label></div>
<h2>진행 순서</h2><ol class="muted" style="font-size:15px;line-height:1.9">
<li>② 평가표에 항목·배점을 입력합니다 (엑셀에서 복사해 붙여넣기 가능)</li><li>③ 계산 규칙에서 최고·최저점 제외, 과락, 선정 방식을 정합니다</li>
<li>④ 대상, ⑤ 위원을 등록하면 위원 코드가 자동 발급됩니다 → 코드표 인쇄</li><li>위 ‘평가 시작’ → 위원들이 PC에서 코드로 입장해 채점합니다</li><li>진행 현황에서 제출 확인 → ‘평가 마감’ → 결과 출력</li></ol>`}

function tItems(){const ev=S.ev;return`
<h2>평가표 <span class="muted">만점 ${maxTotal(ev)}점</span></h2>
<div class="scroll"><table><thead><tr><th style="width:26%">평가 항목</th><th>세부 항목</th><th style="width:100px">배점</th><th style="width:30%">평가 기준(위원에게 표시)</th><th></th></tr></thead><tbody>
${ev.items.map((it,i)=>`<tr><td><input data-c="items" data-i="${i}" data-k="group" value="${esc(it.group)}"></td><td><input data-c="items" data-i="${i}" data-k="name" value="${esc(it.name)}"></td><td><input data-c="items" data-i="${i}" data-k="max" inputmode="decimal" value="${esc(it.max)}" class="num"></td><td><input data-c="items" data-i="${i}" data-k="guide" value="${esc(it.guide)}"></td><td><button class="d s" data-a="rm" data-c="items" data-i="${i}">삭제</button></td></tr>`).join('')}

<h3>엑셀에서 붙여넣기</h3><p class="muted">엑셀에서 ‘평가 항목 | 세부 항목 | 배점 | 평가 기준’ 순서로 칸을 선택해 복사한 뒤 붙여넣으세요. 평가 항목 칸이 비어 있으면 윗줄 항목을 이어받습니다 (병합 셀 대응).</p>
<textarea id="pasteItems" placeholder="사업성	시장 분석의 타당성	15&#10;	수익 모델의 구체성	15"></textarea>
<div class="tools"><button class="g" data-a="pasteItems" data-m="add">아래에 추가</button><button class="g" data-a="pasteItems" data-m="replace">전체 바꾸기</button></div>
<h2>점수 입력 방식</h2><div class="grid">
<label>위원 입력 방식<select data-b="inputMode"><option value="score"${ev.inputMode==='score'?' selected':''}>점수 직접 입력</option><option value="grade"${ev.inputMode==='grade'?' selected':''}>등급 선택 (매우 우수 100% ~ 매우 미흡 20%)</option></select></label></div>
<h2>가점·감점</h2><p class="muted">간사가 대상별로 해당 여부를 체크하면 위원 평균에 더해집니다. 감점은 음수로 입력하세요.</p>
<table><thead><tr><th>가점·감점 항목</th><th style="width:120px">점수</th><th></th></tr></thead><tbody>
${ev.bonuses.map((b,i)=>`<tr><td><input data-c="bonuses" data-i="${i}" data-k="name" value="${esc(b.name)}"></td><td><input data-c="bonuses" data-i="${i}" data-k="pts" inputmode="decimal" value="${esc(b.pts)}" class="num"></td><td><button class="d s" data-a="rm" data-c="bonuses" data-i="${i}">삭제</button></td></tr>`).join('')}
</tbody></table><div class="tools"><button class="g" data-a="add" data-c="bonuses">가점·감점 추가</button><button class="g" data-a="saveTpl">이 평가표를 템플릿으로 저장</button><select id="tpl" style="max-width:260px"><option value="">저장된 템플릿 불러오기…</option></select></div>`}

function tRules(){const ev=S.ev,R=ev.rules;return`
<div class="note t" id="ruleText">${esc(ruleText(ev))}</div>
<h2>최고·최저점 제외</h2><div class="grid">
<label>제외 방식<select data-r="trim"><option value="none"${R.trim==='none'?' selected':''}>제외 안 함 (전원 평균)</option><option value="total"${R.trim==='total'?' selected':''}>총점 기준 — 최고·최저 위원 제외</option><option value="item"${R.trim==='item'?' selected':''}>항목별 — 항목마다 최고·최저 제외</option></select></label>
<label>적용 조건: 위원 수가 몇 명 이상일 때<input data-r="trimMin" inputmode="numeric" value="${esc(R.trimMin)}"></label>
<label>제외 개수 (최고·최저 각각)<input data-r="trimCount" inputmode="numeric" value="${esc(R.trimCount)}"></label></div>
<p class="muted">제척된 위원은 인원수에서 제외됩니다. 예: 위원 5명 중 1명이 제척되면 4명이므로 ‘5명 이상’ 조건에 해당하지 않아 전원 평균을 적용합니다.</p>
<h2>과락</h2><div class="grid">
<label>총점 과락: 평균 몇 점 미만 (0이면 없음)<input data-r="failTotal" inputmode="decimal" value="${esc(R.failTotal)}"></label>
<label>항목 과락: 항목 평균이 배점의 몇 % 미만 (0이면 없음)<input data-r="failItemPct" inputmode="decimal" value="${esc(R.failItemPct)}"></label></div>
<h2>선정 방식</h2><div class="grid">
<label>방식<select data-r="select"><option value="top"${R.select==='top'?' selected':''}>고득점 순 정해진 수</option><option value="cut"${R.select==='cut'?' selected':''}>기준 점수 이상 전원</option></select></label>
<label>선정 수 (고득점 순일 때)<input data-r="selectN" inputmode="numeric" value="${esc(R.selectN)}"></label>
<label>기준 점수 (기준 점수 방식일 때)<input data-r="cut" inputmode="decimal" value="${esc(R.cut)}"></label></div>
<h2>동점 처리 순서</h2><p class="muted">최종점수가 같으면 아래 항목 평균이 높은 순으로 정합니다. 그래도 같으면 ‘동점’으로 표시하고 위원장이 판단합니다.</p><div class="grid">
${[0,1,2].map(n=>`<label>${n+1}순위<select data-tie="${n}"><option value="">선택 안 함</option>${ev.items.map(i=>`<option value="${esc(i.id)}"${R.tie[n]===i.id?' selected':''}>${esc(i.group?i.group+' — ':'')}${esc(i.name)}</option>`).join('')}</select></label>`).join('')}</div>
<h2>기타</h2><div class="grid">
<label>소수점 자리수<select data-r="round">${[0,1,2,3].map(n=>`<option value="${n}"${+R.round===n?' selected':''}>${n}자리</option>`).join('')}</select></label>
<label>편차 경고: 평균과 몇 점 이상 차이 (0이면 없음)<input data-r="devWarn" inputmode="decimal" value="${esc(R.devWarn)}"></label></div>
<h2>공정성</h2>
<label class="chk"><input type="checkbox" data-fair="oath"${ev.fair.oath?' checked':''}> 평가 시작 전 제척·회피 서약 필수</label>
<label class="chk" style="margin-top:8px"><input type="checkbox" data-fair="lock"${ev.fair.lock?' checked':''}> 제출 후 수정 잠금 (간사가 풀어줘야 수정 가능)</label>
<label style="margin-top:12px">서약 문구<textarea data-fair="text">${esc(ev.fair.text)}</textarea></label>`}

function tTargets(){const ev=S.ev;return`
<h2>평가 대상 <span class="muted">${ev.targets.length}개</span></h2>
<div class="scroll"><table><thead><tr><th style="width:44px">순서</th><th>기업·대상명</th><th>사업자번호</th><th>대표자</th><th>과제명</th>${ev.bonuses.map(b=>`<th class="c">${esc(b.name)}<br>${+b.pts>0?'+':''}${esc(b.pts)}</th>`).join('')}<th></th></tr></thead><tbody>
${ev.targets.map((t,i)=>`<tr><td class="num">${i+1}</td><td><input data-c="targets" data-i="${i}" data-k="name" value="${esc(t.name)}"></td><td><input data-c="targets" data-i="${i}" data-k="bizno" value="${esc(t.bizno)}"></td><td><input data-c="targets" data-i="${i}" data-k="rep" value="${esc(t.rep)}"></td><td><input data-c="targets" data-i="${i}" data-k="title" value="${esc(t.title)}"></td>
${ev.bonuses.map(b=>`<td class="c"><input type="checkbox" data-bonus="${esc(b.id)}" data-i="${i}"${(t.bonus||[]).includes(b.id)?' checked':''}></td>`).join('')}<td style="white-space:nowrap"><button class="g s" data-a="up" data-c="targets" data-i="${i}" aria-label="위로">↑</button> <button class="d s" data-a="rm" data-c="targets" data-i="${i}">삭제</button></td></tr>`).join('')}
</tbody></table></div><div class="tools"><button class="g" data-a="add" data-c="targets">대상 추가</button><button class="g" data-a="shuffle">평가 순서 무작위 추첨</button></div>
<h3>엑셀에서 붙여넣기</h3><p class="muted">‘기업명 | 사업자번호 | 대표자 | 과제명’ 순서로 복사해 붙여넣으세요.</p>
<textarea id="pasteTargets"></textarea><div class="tools"><button class="g" data-a="pasteTargets" data-m="add">아래에 추가</button><button class="g" data-a="pasteTargets" data-m="replace">전체 바꾸기</button></div>`}

function tJudges(){const ev=S.ev;return`
<h2>평가위원 <span class="muted">${ev.judges.length}명</span></h2>
<div class="scroll"><table><thead><tr><th>이름</th><th>소속</th><th style="width:120px">구분</th><th class="c" style="width:70px">위원장</th><th style="width:120px">위원 코드</th><th></th></tr></thead><tbody>
${ev.judges.map((j,i)=>`<tr><td><input data-c="judges" data-i="${i}" data-k="name" value="${esc(j.name)}"></td><td><input data-c="judges" data-i="${i}" data-k="org" value="${esc(j.org)}"></td><td><select data-c="judges" data-i="${i}" data-k="kind"><option${j.kind==='외부'?' selected':''}>외부</option><option${j.kind==='내부'?' selected':''}>내부</option></select></td>
<td class="c"><input type="radio" name="chair" data-chair="${i}"${j.chair?' checked':''}></td><td class="num" style="font-size:18px;letter-spacing:2px"><b>${esc(j.code)}</b></td><td style="white-space:nowrap"><button class="g s" data-a="recode" data-i="${i}">재발급</button> <button class="d s" data-a="rm" data-c="judges" data-i="${i}">삭제</button></td></tr>`).join('')}
</tbody></table></div><div class="tools"><button class="g" data-a="add" data-c="judges">위원 추가</button><button class="g" data-a="printCodes">위원 코드표 인쇄</button></div>
<h3>엑셀에서 붙여넣기</h3><p class="muted">‘이름 | 소속 | 구분(내부/외부)’ 순서로 복사해 붙여넣으세요. 코드는 자동 발급됩니다.</p>
<textarea id="pasteJudges"></textarea><div class="tools"><button class="g" data-a="pasteJudges" data-m="add">아래에 추가</button><button class="g" data-a="pasteJudges" data-m="replace">전체 바꾸기</button></div>
<p class="muted">연락처·주민등록번호 등 개인정보는 입력하지 마세요. 위원 코드는 위원 본인에게만 전달하세요.</p>`}

function tProgress(){const ev=S.ev,{rows}=compute(ev,S.scores);const d=+ev.rules.round||2;
const done=ev.judges.filter(j=>S.scores[j.id]?.submitted).length;return`
<div class="tools" style="justify-content:space-between"><h2 style="margin:0">위원별 제출 현황 <span class="muted">${done} / ${ev.judges.length}명 제출</span></h2><button class="g s" data-a="refresh">새로고침</button></div>
<div class="scroll"><table><thead><tr><th>위원</th><th>상태</th>${ev.targets.map(t=>`<th class="num">${esc(t.name)}</th>`).join('')}<th></th></tr></thead><tbody>
${ev.judges.map(j=>{const s=S.scores[j.id];const st=!s?['c-m','미입장']:s.submitted?['c-ok','제출']:['c-w','작성 중'];
return`<tr><td><b>${esc(j.name)}</b>${j.chair?' <span class="muted">위원장</span>':''}</td><td><span class="chip ${st[0]}">${st[1]}</span></td>
${ev.targets.map(t=>{if(!s)return'<td class="num muted">-</td>';if((s.conflicts||[]).includes(t.id))return'<td class="num c-m">제척</td>';const m=(s.marks||{})[t.id];
const filled=m&&ev.items.every(i=>m[i.id]!==undefined&&m[i.id]!=='');const tot=m?ev.items.reduce((a,i)=>a+(+m[i.id]||0),0):null;const r=rows.find(x=>x.t.id===t.id);
return`<td class="num${s.submitted&&r&&r.dev.has(j.id)?' dev':''}">${tot==null?'-':ft(tot)+(filled?'':' <span class="c-w">미완</span>')}</td>`}).join('')}
<td>${s?.submitted?`<button class="g s" data-a="unlock" data-j="${esc(j.id)}">${S.confirm==='un'+j.id?'제출을 취소할까요?':'제출 취소'}</button>`:''}</td></tr>`}).join('')}
</tbody></table></div>
<p class="muted">노란 칸은 해당 대상 평균과 ${esc(ev.rules.devWarn)}점 이상 차이 나는 점수입니다(제출분 기준). ‘제출 취소’를 누르면 해당 위원이 다시 수정·제출할 수 있습니다.</p>
${ev.status==='평가중'?'<p class="muted">이 화면은 15초마다 자동으로 새로고침됩니다.</p>':''}`}

function tResult(){const ev=S.ev,R=ev.rules,d=+R.round||2,{rows,cutTie}=compute(ev,S.scores);
const pend=ev.judges.filter(j=>!S.scores[j.id]?.submitted).length;return`
<div class="note t">${esc(ruleText(ev))}</div>
${pend?`<div class="note">아직 제출하지 않은 위원이 ${pend}명 있습니다. 현재 결과는 제출한 위원 점수만으로 계산한 것입니다.</div>`:''}
${cutTie?'<div class="note" style="border-color:var(--red)">선정 경계에 동점이 있습니다. 위원장 판단이 필요합니다.</div>':''}
<div class="tools"><button data-a="xls">엑셀로 복사</button><button class="g" data-a="csv">엑셀 파일(CSV) 받기</button><button class="g" data-a="printResult">결과표 인쇄</button><button class="g" data-a="printSheets">위원별 채점표 인쇄</button><button class="g s" data-a="refresh">새로고침</button></div>
<div class="scroll"><table><thead><tr><th class="num">순위</th><th>대상</th>${ev.judges.map(j=>`<th class="num">${esc(j.name)}</th>`).join('')}<th class="num">평균</th><th class="num">가점</th><th class="num">최종</th><th>결과</th></tr></thead><tbody>
${rows.map(r=>`<tr class="${r.selected?'sel':''}"><td class="num"><b>${r.fail?'-':r.rank}</b>${r.tie?' <span class="c-w">동점</span>':''}</td><td><b>${esc(r.t.name)}</b><div class="muted">${esc(r.t.title)}</div></td>
${ev.judges.map(j=>{const p=r.per.find(x=>x.j.id===j.id);if(!p)return'<td class="num muted">-</td>';if(p.conflict)return'<td class="num c-m">제척</td>';const dr=r.dropped.has(j.id+':hi')||r.dropped.has(j.id+':lo');return`<td class="num${dr?' drop':''}${r.dev.has(j.id)?' dev':''}">${ft(p.tot)}</td>`}).join('')}
<td class="num">${r.n?fmt(r.base,d):'-'}</td><td class="num">${r.bonus?fmt(r.bonus,d):''}</td><td class="num"><b>${r.n?fmt(r.final,d):'-'}</b></td>
<td>${r.fail?`<span class="chip c-x">${esc(r.fail)}</span>`:r.selected?'<span class="chip c-t">선정</span>':'<span class="chip c-m">미선정</span>'}</td></tr>`).join('')}
</tbody></table></div>
<p class="muted">줄 그은 점수는 최고·최저로 제외된 점수입니다. 항목별 제외 방식에서는 위원 총점에 줄이 표시되지 않고 항목 단위로 제외됩니다.</p>
${ev.judges.some(j=>S.scores[j.id]?.overall)?`<h2>종합의견</h2>${ev.judges.filter(j=>S.scores[j.id]?.overall).map(j=>`<p><b>${esc(j.name)}${j.chair?' (위원장)':''}</b><br>${esc(S.scores[j.id].overall)}</p>`).join('')}`:''}`}

/* ================= 화면: 위원 ================= */
function vJudge(){const ev=S.ev,j=ev.judges.find(x=>x.id===S.jid),s=S.js;
if(ev.fair.oath&&!s.oath)return`
<div class="top"><div><h1>제척·회피 서약</h1><div class="sub">${esc(ev.name)} · ${esc(j.name)} 위원</div></div><button class="g" data-a="jout">나가기</button></div>
<p style="font-size:17px;max-width:70ch">${esc(ev.fair.text)}</p>
<h2>이해관계가 있는 대상 (해당하면 체크)</h2>

function vSummary(ev,j,s,T,filled,locked){const miss=T.filter(t=>!filled(t));return`

${locked?'<div class="note t">제출이 완료되었습니다. 수정이 필요하면 간사에게 말씀해 주세요.</div>':''}

${T.map(t=>{const m=(s.marks||{})[t.id]||{};return`<tr><td><b>${esc(t.name)}</b></td>${ev.items.map(i=>`<td class="num">${m[i.id]===undefined||m[i.id]===''?'<span class="c-x">미입력</span>':esc(m[i.id])}</td>`).join('')}<td class="num"><b>${ft(ev.items.reduce((a,i)=>a+(+m[i.id]||0),0))}</b></td></tr>`}).join('')}
</tbody></table>
${locked?'':`<label style="margin-top:16px">종합의견${j.chair?' (위원장 필수)':''}<textarea data-overall="1">${esc(s.overall||'')}</textarea></label>
${miss.length?`<div class="note">아직 입력하지 않은 대상이 있습니다: ${miss.map(t=>esc(t.name)).join(', ')}</div>`:''}
<div class="tools"><button data-a="submit"${miss.length?' disabled':''}>${S.confirm==='submit'?'정말 제출할까요? 한 번 더 누르세요':'최종 제출'}</button></div>`}`}

/* ================= 렌더 ================= */
function render(){
  const a=$('app');
  a.innerHTML=S.view==='home'?vHome():S.view==='list'?vList():S.view==='edit'?vEdit():S.view==='judge'?vJudge():'';
  if(S.view==='edit'&&S.tab==='items')fillTpl();
  if(S.view==='edit'&&['progress','result'].includes(S.tab)&&S.ev.status==='평가중'){clearInterval(poll);poll=setInterval(async()=>{if(document.hidden)return;await loadScores(S.ev);if(S.view==='edit'&&['progress','result'].includes(S.tab))render()},15000)}
}
async function fillTpl(){const sel=$('tpl');if(!sel)return;try{const l=await Store.list('tpl:');sel.innerHTML='<option value="">저장된 템플릿 불러오기…</option>'+l.map(x=>`<option value="${esc(x.key)}">${esc(x.val.name)}</option>`).join('')}catch{}}

/* ================= 붙여넣기 ================= */
const rowsOf=t=>t.split(/\r?\n/).filter(l=>l.trim()).map(l=>(l.includes('\t')?l.split('\t'):l.split(',')).map(x=>x.trim()));
function pasteItems(mode){const L=rowsOf($('pasteItems').value);if(!L.length)return toast('붙여넣을 내용이 없습니다');let g='';
  const out=L.map(c=>{if(c[0])g=c[0];const mx=parseFloat(String(c[2]||'').replace(/[^\d.]/g,''));return{id:'i'+uid(),group:g,name:c[1]||c[0]||'',max:isNaN(mx)?0:mx,guide:c[3]||''}}).filter(x=>x.name);
  S.ev.items=mode==='replace'?out:[...S.ev.items,...out];saveEv();render();toast(out.length+'개 항목을 반영했습니다')}
function pasteTargets(mode){const out=rowsOf($('pasteTargets').value).map(c=>({id:'t'+uid(),name:c[0]||'',bizno:c[1]||'',rep:c[2]||'',title:c[3]||'',bonus:[]})).filter(x=>x.name);
  S.ev.targets=mode==='replace'?out:[...S.ev.targets,...out];saveEv();render();toast(out.length+'개 대상을 반영했습니다')}
function pasteJudges(mode){if(mode==='replace')S.ev.judges=[];const out=rowsOf($('pasteJudges').value).filter(c=>c[0]).map(c=>({id:'j'+uid(),name:c[0],org:c[1]||'',kind:/내부/.test(c[2]||'')?'내부':'외부',chair:false,code:''}));
  out.forEach(j=>{j.code=newCode(S.ev);S.ev.judges.push(j)});saveEv();render();toast(out.length+'명을 반영했습니다')}

/* ================= 출력 ================= */
function table2d(){const ev=S.ev,d=+ev.rules.round||2,{rows}=compute(ev,S.scores);
  const h=['순위','대상','사업자번호','대표자','과제명',...ev.judges.map(j=>j.name),...ev.items.map(i=>i.name+' 평균'),'평균','가점','최종','결과'];
  const b=rows.map(r=>[r.fail?'':r.rank+(r.tie?' (동점)':''),r.t.name,r.t.bizno,r.t.rep,r.t.title,...ev.judges.map(j=>{const p=r.per.find(x=>x.j.id===j.id);return!p?'':p.conflict?'제척':p.tot}),...ev.items.map(i=>r.n?fmt(r.itemAvg[i.id],d):''),r.n?fmt(r.base,d):'',r.bonus||'',r.n?fmt(r.final,d):'',r.fail||(r.selected?'선정':'미선정')]);
  return[h,...b]}
function doPrint(html){$('print').innerHTML=html;try{window.print()}catch{toast('이 화면에서는 인쇄가 차단되어 있습니다. 배포본(GitHub 주소)에서 인쇄해 주세요')}}

  doPrint(`<div class="pg"><h1>${esc(ev.name)} 평가 결과표</h1><div class="meta"><span>평가일: ${esc(ev.date)} ${esc(ev.place)}</span><span>${esc(ev.type)} · 만점 ${maxTotal(ev)}점</span></div>
  <table><thead><tr><th>순위</th><th>대상</th>${ev.judges.map((j,i)=>`<th>위원${i+1}</th>`).join('')}<th>평균</th><th>가점</th><th>최종</th><th>결과</th></tr></thead><tbody>

/* ================= 샘플 ================= */
function sample(){const ev=newEval();ev.name='(샘플) 2027 창업기업 서류평가';ev.place='본원 3층 회의실';
  ev.items=[['사업성','시장 분석의 타당성',15],['사업성','수익 모델의 구체성',15],['기술성','기술 차별성',20],['기술성','실현 가능성',15],['역량','대표자·팀 역량',20],['역량','추진 계획의 구체성',15]].map(([g,n,m])=>({id:'i'+uid(),group:g,name:n,max:m,guide:''}));
  ev.bonuses=[{id:'b'+uid(),name:'지역 청년기업',pts:2},{id:'b'+uid(),name:'여성기업',pts:1}];
  ev.targets=['가람테크','누리바이오','다온소프트','라온에너지','마루로봇','바다식품','사랑케어','아라모빌리티'].map((n,i)=>({id:'t'+uid(),name:n+'(가상)',bizno:'',rep:'',title:['AI 품질검사','친환경 소재','물류 플랫폼','수소 부품','협동 로봇','수산 가공','돌봄 서비스','전기 이륜차'][i],bonus:i%3===0?[ev.bonuses[0].id]:i===4?[ev.bonuses[1].id]:[]}));
  ev.judges=[1,2,3,4,5].map(n=>({id:'j'+uid(),name:'평가위원'+n,org:n<=3?'외부 전문가':'진흥원',kind:n<=3?'외부':'내부',chair:n===1,code:''}));ev.judges.forEach(j=>j.code=newCode(ev));
  ev.rules.tie=[ev.items[2].id,ev.items[4].id];ev.status='평가중';
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const sc={};ev.judges.forEach((j,ji)=>{const s={oath:true,conflicts:ji===3?[ev.targets[2].id]:[],marks:{},cmt:{},overall:j.chair?'전반적으로 사업화 계획이 구체적이었음.':'',submitted:ji<4,at:new Date().toISOString()};
    ev.targets.forEach((t,ti)=>{if(s.conflicts.includes(t.id))return;const q=0.55+((ti*37)%40)/100+(rnd()-.5)*.2+(ji===4?.15:0);s.marks[t.id]={};ev.items.forEach(i=>s.marks[t.id][i.id]=Math.max(0,Math.min(i.max,Math.round(i.max*q))))});sc[j.id]=s});
  return{ev,sc}}

 try{

    const j=evx.judges.find(x=>x.code===code);const s=(await Store.get('score:'+evx.id+':'+j.id))||{oath:false,conflicts:[],marks:{},cmt:{},overall:'',submitted:false};s.marks=s.marks||{};s.cmt=s.cmt||{};

  if(a==='list'){await loadEvals();return go('list')}
  if(a==='new'){const n=newEval();await Store.set('eval:'+n.id,n);S.scores={};return go('edit',{ev:n,tab:'basic'})}

    await Store.set('eval:'+n.id,n);await loadEvals();toast('복제했습니다');return render()}
  if(a==='delev'){const id=b.dataset.id;if(S.confirm!=='del'+id){S.confirm='del'+id;return render()}await Store.del('eval:'+id);for(const x of await Store.list('score:'+id+':'))await Store.del(x.key);await loadEvals();S.confirm=null;return render()}
  if(a==='tab'){S.tab=b.dataset.t;S.confirm=null;if(['progress','result'].includes(S.tab))await loadScores(ev);clearInterval(poll);return render()}
  if(a==='refresh'){await loadScores(ev);toast('새로고침했습니다');return render()}
  if(a==='start'){const miss=[!ev.items.length&&'평가표',!ev.targets.length&&'대상',!ev.judges.length&&'위원'].filter(Boolean);if(miss.length)return toast(miss.join(', ')+'을(를) 먼저 등록해 주세요');
    if(maxTotal(ev)<=0)return toast('배점을 확인해 주세요');ev.status='평가중';saveEv();toast('평가를 시작했습니다. 위원들이 코드로 입장할 수 있습니다');S.tab='progress';await loadScores(ev);return render()}
  if(a==='close'){ev.status='마감';saveEv();toast('평가를 마감했습니다. 위원 입장이 제한됩니다');S.tab='result';await loadScores(ev);return render()}
  if(a==='reopen'){ev.status='평가중';saveEv();return render()}
  if(a==='add'){const c=b.dataset.c;const n=c==='items'?{id:'i'+uid(),group:'',name:'',max:10,guide:''}:c==='bonuses'?{id:'b'+uid(),name:'',pts:1}:c==='targets'?{id:'t'+uid(),name:'',bizno:'',rep:'',title:'',bonus:[]}:{id:'j'+uid(),name:'',org:'',kind:'외부',chair:false,code:newCode(ev)};
    ev[c].push(n);saveEv();return render()}
  if(a==='rm'){const c=b.dataset.c,i=+b.dataset.i;const rm=ev[c][i];ev[c].splice(i,1);
    if(c==='bonuses')ev.targets.forEach(t=>t.bonus=(t.bonus||[]).filter(x=>x!==rm.id));if(c==='items')ev.rules.tie=ev.rules.tie.filter(x=>x!==rm.id);saveEv();return render()}
  if(a==='up'){const c=b.dataset.c,i=+b.dataset.i;if(i>0){[ev[c][i-1],ev[c][i]]=[ev[c][i],ev[c][i-1]];saveEv();render()}return}
  if(a==='shuffle'){for(let i=ev.targets.length-1;i>0;i--){const k=Math.floor(Math.random()*(i+1));[ev.targets[i],ev.targets[k]]=[ev.targets[k],ev.targets[i]]}saveEv();toast('평가 순서를 무작위로 정했습니다');return render()}
  if(a==='recode'){ev.judges[+b.dataset.i].code=newCode(ev);saveEv();return render()}
  if(a==='pasteItems')return pasteItems(b.dataset.m);
  if(a==='pasteTargets')return pasteTargets(b.dataset.m);
  if(a==='pasteJudges')return pasteJudges(b.dataset.m);
  if(a==='saveTpl'){if(!ev.items.length)return toast('평가표가 비어 있습니다');const name=(ev.name||'평가표')+' 평가표';await Store.set('tpl:'+uid(),{name,items:ev.items,bonuses:ev.bonuses,inputMode:ev.inputMode,rules:ev.rules});toast('템플릿으로 저장했습니다: '+name);return fillTpl()}
  if(a==='unlock'){const id=b.dataset.j;if(S.confirm!=='un'+id){S.confirm='un'+id;return render()}const s=S.scores[id];s.submitted=false;await Store.set('score:'+ev.id+':'+id,s);S.confirm=null;toast('제출을 취소했습니다. 위원이 다시 수정할 수 있습니다');return render()}
  if(a==='xls'){const t=table2d().map(r=>r.map(x=>String(x??'').replace(/[\t\n]/g,' ')).join('\t')).join('\n');try{await navigator.clipboard.writeText(t);toast('복사했습니다. 엑셀에 붙여넣기 하세요')}catch{toast('복사가 차단되었습니다. CSV 받기를 이용해 주세요')}return}
  if(a==='csv'){const t='﻿'+table2d().map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');try{const u=URL.createObjectURL(new Blob([t],{type:'text/csv;charset=utf-8'}));const l=document.createElement('a');l.href=u;l.download=(ev.name||'평가결과')+'.csv';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}catch{toast('이 화면에서는 파일 받기가 차단되어 있습니다. ‘엑셀로 복사’를 이용해 주세요')}return}
  if(a==='printResult')return printResult();
  if(a==='printSheets')return printSheets();
  if(a==='printCodes')return printCodes();
 }catch(err){if(err?.code==='auth'){KEY='';LS.set('ev.key','');toast('기관 접속 코드가 맞지 않습니다. 다시 입력해 주세요');return go('home')}toast('처리 실패 ('+(err?.code||err?.message||'네트워크')+')')}
});
document.addEventListener('input',e=>{const el=e.target,ev=S.ev,d=el.dataset;if(!ev)return;
  if(d.b){ev[d.b]=el.value;return saveEv()}
  if(d.c&&d.k){let v=el.value;if(d.k==='max'||d.k==='pts')v=v===''?'':Number(v.replace(/[^\d.-]/g,''))||0;ev[d.c][+d.i][d.k]=v;saveEv();if(d.k==='max'){const h=document.querySelector('h2 .muted');if(h)h.textContent='만점 '+maxTotal(ev)+'점'}return}
  if(d.r){ev.rules[d.r]=['trim','select'].includes(d.r)?el.value:Number(el.value)||0;saveEv();const n=$('ruleText');if(n)n.textContent=ruleText(ev);return}
  if(d.fair){ev.fair[d.fair]=el.type==='checkbox'?el.checked:el.value;return saveEv()}
  if(d.sc){const s=S.js,t=S.cur;let v=el.value.trim();if(v!==''){v=Number(v);const mx=+(d.max??Infinity);if(isNaN(v)||v<0||v>mx){$('scmsg').textContent=`0 ~ ${mx} 사이로 입력해 주세요`;el.style.borderColor='var(--red)';return}}
    el.style.borderColor='';$('scmsg').textContent='';s.marks[t][d.sc]=v;const tot=ev.items.reduce((a,i)=>a+(+s.marks[t][i.id]||0),0);$('tot').textContent=ft(tot);saveJudge();return}
  if(d.cmt){S.js.cmt[d.cmt]=el.value;return saveJudge()}
  if(d.overall){S.js.overall=el.value;return saveJudge()}
});
document.addEventListener('change',async e=>{const el=e.target,ev=S.ev,d=el.dataset;if(!ev)return;
  if(d.tie!==undefined){const t=[...ev.rules.tie];t[+d.tie]=el.value;ev.rules.tie=t.filter(Boolean);saveEv();return render()}
  if(d.bonus){const t=ev.targets[+d.i];t.bonus=el.checked?[...(t.bonus||[]),d.bonus]:(t.bonus||[]).filter(x=>x!==d.bonus);return saveEv()}
  if(d.chair!==undefined){ev.judges.forEach((j,i)=>j.chair=i===+d.chair);return saveEv()}
  if(d.cf){const s=S.js;s.conflicts=el.checked?[...(s.conflicts||[]),d.cf]:(s.conflicts||[]).filter(x=>x!==d.cf);return saveJudge()}
  if(d.sc&&el.tagName==='SELECT'){/* 등급 선택은 input 이벤트로 처리됨 */}
  if(el.id==='tpl'&&el.value){const tp=await Store.get(el.value);if(!tp)return;ev.items=tp.items.map(i=>({...i,id:'i'+uid()}));const map={};ev.bonuses=(tp.bonuses||[]).map(b=>{const id='b'+uid();map[b.id]=id;return{...b,id}});ev.inputMode=tp.inputMode||'score';ev.rules={...ev.rules,...tp.rules,tie:[]};
    saveEv();toast('템플릿을 불러왔습니다: '+tp.name+' (동점 순서는 다시 선택해 주세요)');return render()}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){if(e.target.id==='jcode')document.querySelector('[data-a=jlogin]').click();if(e.target.id==='apin')document.querySelector('[data-a=alogin]').click();if(e.target.id==='key')document.querySelector('[data-a=setkey]').click()}});
render();
}
</script>
</body>
</html>
